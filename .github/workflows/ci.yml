name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, unit tests, build, bundle budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changeset status compares against the base branch

      - uses: pnpm/action-setup@v4 # version comes from "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, build (Turborepo, cached)
        run: pnpm turbo run lint typecheck test build

      - name: Bundle budgets
        run: pnpm size

      - name: Design-system and contract changes need a changeset
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

      - name: Build Storybook
        run: pnpm turbo run build-storybook

      - uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: packages/design-system/storybook-static
          retention-days: 7

  e2e:
    name: Playwright (composed app, production build)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @verity/e2e exec playwright install --with-deps chromium
      - name: Run E2E (builds and previews every app, then tests the composed shell)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
